<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="offline.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abo Belal Cyber Host v3.0</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(135deg, #050515 0%, #0b0520 50%, #150530 100%);
            color: #f8fafc; font-family: 'Segoe UI', sans-serif;
            text-align: center; margin: 0; padding: 0;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        .bg-glow {
            position: absolute; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(236,56,188,0.2) 0%, rgba(0,0,0,0) 70%);
            top: 10%; left: 10%; animation: floatGlow 8s infinite alternate;
        }
        .host-card {
            background: rgba(10, 5, 25, 0.75); backdrop-filter: blur(20px);
            border: 2px solid #ec38bc; border-radius: 30px;
            padding: 35px; width: 90%; max-width: 600px; z-index: 10;
            box-shadow: 0 0 50px rgba(236, 56, 188, 0.4);
        }
        /* تكبير حجم الصورة الشخصية وإضافة توهج أقوى */
        .profile-img {
            width: 200px; height: 200px;
            border-radius: 50%;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.8);
            object-fit: cover;
            margin-bottom: 20px;
        }
        h1 { 
            font-size: 3rem; margin: 0; font-weight: 900;
            background: linear-gradient(45deg, #00ffcc, #ec38bc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .btn-main {
            background: linear-gradient(135deg, #ec38bc 0%, #7303c0 100%);
            color: white; border: none; padding: 18px; font-size: 1.3rem; font-weight: 900; border-radius: 14px;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 25px rgba(236, 56, 188, 0.4);
        }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 10px 40px rgba(236, 56, 188, 0.8); }
        .sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-sub {
            background: rgba(255, 255, 255, 0.05); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 12px; font-size: 1rem; font-weight: 700; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-sub:hover { background: rgba(0, 255, 204, 0.1); border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }
        .loader-container { display: none; margin-top: 20px; }
        .progress-bar { width: 100%; background-color: #120a26; border-radius: 10px; height: 12px; border: 1px solid #331a5e; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffcc, #ec38bc); }
        .status-text { font-size: 1  rem; color: #a78bfa; margin-top: 10px; font-weight: bold; }
        .footer { position: absolute; bottom: 15px; color: #4b4b75; font-size: 0.85rem; }
        @keyframes floatGlow { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="host-card">
        <!-- صورتك الفخمة بالمقاس الجديد -->
        <img src="avatar.jpg" alt="Abo Belal" class="profile-img">
        
        <h1>ABO BELAL HOST</h1>
        <div class="subtitle">منصة التعديل الخاصة بأبو بلال | إصدار 9.00</div>
        
        <div class="grid-container">
            <button class="btn-main" onclick="startPayload('GoldHEN v2.4')">تفعيل ثغرة GoldHEN v2.4</button>
            <div class="sub-grid">
                <button class="btn-sub" onclick="startPayload('Fan Control')">تحكم المروحة 🎮</button>
                <button class="btn-sub" onclick="startPayload('Disable Updates')">حظر التحديثات 🛑</button>
            </div>
        </div>

        <div class="loader-container" id="loaderBox">
            <div class="progress-bar"><div class="progress-fill" id="myBar"></div></div>
            <div class="status-text" id="statusLabel">انتظار المتصفح...</div>
        </div>
    </div>

    <div class="footer">
        تعديل مخصص لـ أبو بلال © كاش أوفلاين ذكي ومستقر
    </div>

    <script>
        window.applicationCache.addEventListener('cached', function(e) { alert("تم تحديث الواجهة وحفظ صورتك أوفلاين بنجاح!"); }, false);
        function startPayload(name) {
            document.getElementById("loaderBox").style.display = "block";
            var elem = document.getElementById("myBar"); var status = document.getElementById("statusLabel"); var width = 0;
            status.innerText = "جاري استدعاء: " + name + "...";
            var id = setInterval(function() {
                if (width >= 100) { 
                    clearInterval(id); 
                    if(name.includes('GoldHEN')) status.innerHTML = "<span style='color: #00ffcc;'>[أدخل الفلاشة الآن] ثم اضغط موافق!</span>";
                    else status.innerHTML = "<span style='color: #4ade80;'>تم تفعيل " + name + " بنجاح!</span>";
                } else { width++; elem.style.width = width + '%'; }
            }, 30);
        }
    </script>
</body>
</html>
